[grype:check]
# One JSON object per line, emitted by bin/grype_checks.py
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
KV_MODE = json

# Use the scan's own epoch timestamp, not the time Splunk happened to poll.
# "timestamp" is the first field in the record, ahead of "timestamp_iso".
TIME_PREFIX = "timestamp":
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 12

category = Security
description = grype-verify SBOM vulnerability scan result
