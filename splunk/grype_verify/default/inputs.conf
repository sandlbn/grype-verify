#
# Pull scan results from the grype-verify REST API every 5 minutes.
# Override GRYPE_VERIFY_URL in local/inputs.conf if the API is on another host.

[script://$SPLUNK_HOME/etc/apps/grype_verify/bin/grype_checks.py]
disabled = 0
interval = 300
sourcetype = grype:check
index = main
python.version = python3
