[package]
name = "grype-verify"
version = "0.2.0"
edition = "2021"
description = "Offline-aware grype vulnerability scanner with embedded result tracking and REST API"

[[bin]]
name = "grype-verify"
path = "src/main.rs"

[dependencies]
clap       = { version = "=4.5.38", features = ["derive", "env"] }
anyhow     = "1"
rusqlite   = { version = "0.31", features = ["bundled"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

